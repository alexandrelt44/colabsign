# ColabSign: constrói a imagem Docker do fork (colab/Dockerfile).
# Em pull requests só constrói, para provar que o Dockerfile segue
# funcionando. Na main (ou "Run workflow") publica em
# ghcr.io/<dono>/colabsign:<sha> e :main. Arquivo só do fork.
name: ColabSign image

on:
  pull_request:
    paths:
      - "colab/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/colab-image.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: colab-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tradução pt-BR (colab/i18n) acompanha o upstream: falha se uma frase
  # nova ou alterada ficou sem tradução ou se uma troca não casa mais.
  i18n:
    name: ColabSign pt-BR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: node colab/i18n/aplicar.mjs --check --estrito --faltando

  image:
    name: Build ColabSign image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/colabsign" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: colab/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
